<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nakul Haridas</title>
  <meta name="description" content="Personal site of Nakul Haridas — coming soon.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper:  #FBFAF7;
      --ink:    #1C1B1F;
      --muted:  #605E66;
      --accent: #33478F;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper:  #141317;
        --ink:    #ECEAE3;
        --muted:  #9A97A1;
        --accent: #98A6E8;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
      padding: 1.5rem;
    }

    .box { max-width: 30rem; }

    .motif { width: 120px; height: auto; margin-bottom: 2rem; }
    .motif circle { fill: var(--accent); }
    .motif line { stroke: var(--accent); stroke-width: 1; opacity: .35; }

    h1 {
      font-family: "Spectral", Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.2rem, 7vw, 3.2rem);
      letter-spacing: -0.015em;
      margin: 0 0 .75rem;
    }

    p {
      color: var(--muted);
      font-size: 1.05rem;
      margin: 0 0 .5rem;
      line-height: 1.6;
    }

    .tag {
      font-family: "Spectral", Georgia, serif;
      font-style: italic;
      font-size: 1.15rem;
      color: var(--muted);
      margin: 0 0 1.75rem;
    }

    a {
      color: var(--accent);
      text-underline-offset: 2px;
    }
  </style>
</head>

<body>
  <div class="box">
    <svg class="motif" viewBox="0 0 200 200" aria-hidden="true">
      <line x1="52" y1="70" x2="70" y2="62"/>
      <line x1="90" y1="66" x2="110" y2="58"/>
      <line x1="72" y1="120" x2="94" y2="128"/>
      <line x1="118" y1="126" x2="140" y2="118"/>
      <g>
        <circle cx="52" cy="70" r="2.4" opacity=".85"/>
        <circle cx="70" cy="62" r="2" opacity=".7"/>
        <circle cx="90" cy="66" r="2.2" opacity=".8"/>
        <circle cx="110" cy="58" r="1.8" opacity=".6"/>
        <circle cx="128" cy="70" r="2.1" opacity=".75"/>
        <circle cx="146" cy="64" r="1.7" opacity=".55"/>
        <circle cx="64" cy="94" r="1.9" opacity=".6"/>
        <circle cx="100" cy="92" r="2.2" opacity=".8"/>
        <circle cx="134" cy="96" r="1.8" opacity=".6"/>
        <circle cx="72" cy="120" r="2.1" opacity=".75"/>
        <circle cx="94" cy="128" r="1.7" opacity=".55"/>
        <circle cx="118" cy="126" r="2.3" opacity=".85"/>
        <circle cx="140" cy="118" r="1.8" opacity=".6"/>
        <circle cx="86" cy="146" r="1.9" opacity=".65"/>
        <circle cx="112" cy="150" r="1.6" opacity=".5"/>
      </g>
    </svg>

    <h1>Nakul Haridas</h1>
    <p class="tag">PhD candidate, Applied Mathematics</p>
    <p>This site is under construction. Please check back soon.</p>
    <p>In the meantime, reach me at <a href="mailto:nakulh@ncsu.edu">nakulh@ncsu.edu</a>.</p>
  </div>
</body>
</html>
